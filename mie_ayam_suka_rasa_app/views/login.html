  <section id="viewGate" class="hide">
    <div class="card" style="max-width:420px;margin:0 auto">
      <h2>Masuk Kasir/Admin</h2>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username">
      <label for="password">Password (min. 6 karakter)</label>
      <input id="password" type="password" autocomplete="current-password">
      <div class="actions">
        <button class="btn" id="btnLogin">Masuk</button>
        <button class="btn ghost" id="btnSignup">Daftar</button>
      </div>
      <p class="muted" id="gateNote">Pengguna pertama yang masuk otomatis menjadi admin. Akun lain tidak bisa membuat pesanan atau mengubah produk.</p>
      <div class="actions"><button class="btn ghost sm hide" id="btnGateLogout">Keluar</button></div>
    </div>
  </section>
