  <section id="viewProduk" class="hide">
    <div class="card">
      <h2 id="formTitle">Tambah Produk</h2>
      <input type="hidden" id="pid">
      <div class="row">
        <div><label for="pname">Nama produk</label><input id="pname" maxlength="100"></div>
        <div><label for="pprice">Harga (Rp)</label><input id="pprice" placeholder="mis. 15.000"></div>
      </div>
      <div class="row">
        <div><label for="pcat">Kategori</label>
          <select id="pcat"><option>Mie Ayam</option><option>Minuman</option><option>Tambahan</option><option>Lainnya</option></select></div>
        <div><label for="pstock">Stok (0 = tidak dihitung)</label><input id="pstock" type="number" min="0" value="0"></div>
      </div>
      <label for="pdesc">Deskripsi</label><textarea id="pdesc" rows="2"></textarea>
      <label for="pfile">Foto produk (opsional, JPG/PNG)</label>
      <input id="pfile" type="file" accept="image/*">
      <input type="hidden" id="pimg">
      <div id="pimgBox" class="hide" style="margin-top:8px">
        <img id="ppreview" alt="Pratinjau foto" style="width:140px;height:100px;object-fit:cover;border-radius:10px;display:block">
        <button class="btn ghost sm" id="btnImgDel" type="button" style="margin-top:6px">Hapus gambar</button>
      </div>
      <label><input id="pactive" type="checkbox" checked style="width:auto"> Tampilkan di menu (aktif)</label>
      <div class="actions">
        <button class="btn" id="btnSave">Simpan</button>
        <button class="btn ghost" id="btnReset">Batal</button>
      </div>
    </div>
    <div class="card">
      <h2>Daftar Produk</h2>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Nama</th><th>Kategori</th><th>Harga</th><th>Status</th><th>Aksi</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <h2>Pengguna (Pemilik / Kasir)</h2>
      <div class="row">
        <div><label for="sEmail">Email (harus sudah Daftar)</label><input id="sEmail" type="email"></div>
        <div><label for="sRole">Peran</label><select id="sRole"><option value="kasir">Kasir</option><option value="pemilik">Pemilik</option><option value="hapus">Hapus akses</option></select></div>
      </div>
      <div class="actions"><button class="btn" id="btnStaff" type="button">Simpan</button></div>
      <div class="tablewrap"><table><thead><tr><th>Email</th><th>Peran</th></tr></thead><tbody id="staffRows"></tbody></table></div>
    </div>
  </section>
