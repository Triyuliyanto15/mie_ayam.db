<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Mie Ayam Suka Rasa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍜</text></svg>">
<style>
  :root{--bg:#fff8ee;--card:#fff;--ink:#2b1d12;--muted:#7a6a5c;--brand:#d9480f;--brand-d:#b23a0a;--line:#ecdcc8;--ok:#2f9e44;--bad:#c92a2a}
  @media (prefers-color-scheme:dark){:root{--bg:#1c130c;--card:#271b12;--ink:#f6e9da;--muted:#b9a794;--line:#4a3626}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--brand);color:#fff;padding:18px 16px}
  header h1{margin:0;font-size:1.3rem} header p{margin:2px 0 0;opacity:.9;font-size:.9rem}
  main{max-width:960px;margin:0 auto;padding:16px}
  nav{display:flex;gap:8px;margin-bottom:16px}
  nav button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-weight:600;cursor:pointer}
  nav button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .item .img{height:110px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:2.4rem}
  .item .img img{width:100%;height:100%;object-fit:cover}
  .item .body{padding:12px}
  .item h3{margin:0 0 4px;font-size:1rem} .muted{color:var(--muted);font-size:.85rem}
  .price{color:var(--brand);font-weight:700;margin-top:6px}
  label{display:block;font-size:.85rem;margin:10px 0 4px;color:var(--muted)}
  input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.row{grid-template-columns:1fr}}
  .btn{padding:10px 14px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--brand-d)} .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.bad{background:var(--bad)} .btn.sm{padding:6px 10px;font-size:.8rem}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .tablewrap{overflow-x:auto} table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  .tag{padding:2px 8px;border-radius:99px;font-size:.75rem;font-weight:600}
  .tag.on{background:#d3f9d8;color:#1b6b2e} .tag.off{background:#ffe3e3;color:#8f1d1d}
  .msg{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:.9rem}
  .msg.err{background:#ffe3e3;color:#8f1d1d} .msg.ok{background:#d3f9d8;color:#1b6b2e}
  .hide{display:none}
</style>
</head>
<body>
<header>
  <h1>🍜 Dashboard Mie Ayam Suka Rasa</h1>
  <p>Kelola menu dan produk</p>
</header>
<main>
  <nav>
    <button id="tabMenu" class="on">Menu</button>
    <button id="tabAdmin">Admin</button>
  </nav>

  <div id="msg"></div>

  <!-- MENU PUBLIK -->
  <section id="viewMenu">
    <div class="grid" id="menuGrid"></div>
    <p class="muted" id="menuEmpty" hidden>Belum ada produk aktif.</p>
  </section>

  <!-- ADMIN -->
  <section id="viewAdmin" class="hide">
    <div id="loginBox" class="card">
      <h2 style="margin-top:0">Masuk Admin</h2>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username">
      <label for="password">Password (min. 6 karakter)</label>
      <input id="password" type="password" autocomplete="current-password">
      <div class="actions">
        <button class="btn" id="btnLogin">Masuk</button>
        <button class="btn ghost" id="btnSignup">Daftar</button>
      </div>
      <p class="muted">Pengguna pertama yang masuk otomatis menjadi admin. Setelah itu akun lain tidak bisa mengubah produk.</p>
    </div>

    <div id="adminBox" class="hide">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <strong id="who"></strong>
          <button class="btn ghost sm" id="btnLogout">Keluar</button>
        </div>
      </div>

      <div class="card">
        <h2 style="margin-top:0" id="formTitle">Tambah Produk</h2>
        <input type="hidden" id="pid">
        <div class="row">
          <div><label for="pname">Nama produk</label><input id="pname" maxlength="100"></div>
          <div><label for="pprice">Harga (Rp)</label><input id="pprice" type="number" min="0" step="500"></div>
        </div>
        <div class="row">
          <div><label for="pcat">Kategori</label>
            <select id="pcat">
              <option>Mie Ayam</option><option>Minuman</option><option>Tambahan</option><option>Lainnya</option>
            </select></div>
          <div><label for="pstock">Stok</label><input id="pstock" type="number" min="0" value="0"></div>
        </div>
        <label for="pdesc">Deskripsi</label><textarea id="pdesc" rows="2"></textarea>
        <label for="pimg">URL gambar (opsional)</label><input id="pimg" type="url" placeholder="https://...">
        <label><input id="pactive" type="checkbox" checked style="width:auto"> Tampilkan di menu (aktif)</label>
        <div class="actions">
          <button class="btn" id="btnSave">Simpan</button>
          <button class="btn ghost" id="btnReset">Batal</button>
        </div>
      </div>

      <div class="card">
        <h2 style="margin-top:0">Daftar Produk</h2>
        <div class="tablewrap">
          <table>
            <thead><tr><th>Nama</th><th>Kategori</th><th>Harga</th><th>Stok</th><th>Status</th><th>Aksi</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// Key publik (aman di browser). Akses data dibatasi oleh Row Level Security di Supabase.
const SUPABASE_URL = "https://xwxcegylykvqzwypypvx.supabase.co";
const SUPABASE_KEY = "sb_publishable_I-fiTcoCDDGYX1ay9a5TnQ_Te3xFCzN";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const rupiah = (n) => "Rp " + Number(n || 0).toLocaleString("id-ID");
let isAdmin = false;

function show(text, type) {
  const m = $("msg");
  m.className = "msg " + (type || "ok");
  m.textContent = text;
  m.hidden = !text;
  if (text) setTimeout(() => { m.hidden = true; }, 5000);
}
function tab(name) {
  $("viewMenu").classList.toggle("hide", name !== "menu");
  $("viewAdmin").classList.toggle("hide", name !== "admin");
  $("tabMenu").classList.toggle("on", name === "menu");
  $("tabAdmin").classList.toggle("on", name === "admin");
}
$("tabMenu").onclick = () => { tab("menu"); loadMenu(); };
$("tabAdmin").onclick = () => { tab("admin"); refreshAuth(); };

/* ---------- MENU PUBLIK ---------- */
async function loadMenu() {
  const { data, error } = await db.from("products")
    .select("id,name,price,category,description,image_url,stock")
    .eq("active", true).order("category").order("name");
  if (error) { show("Gagal memuat menu: " + error.message, "err"); return; }
  const grid = $("menuGrid");
  grid.replaceChildren();
  $("menuEmpty").hidden = data.length > 0;
  for (const p of data) {
    const el = document.createElement("div"); el.className = "item";
    const img = document.createElement("div"); img.className = "img";
    if (p.image_url) { const i = document.createElement("img"); i.src = p.image_url; i.alt = p.name; i.loading = "lazy"; img.appendChild(i); }
    else img.textContent = p.category === "Minuman" ? "🧋" : "🍜";
    const body = document.createElement("div"); body.className = "body";
    const h = document.createElement("h3"); h.textContent = p.name;
    const c = document.createElement("div"); c.className = "muted"; c.textContent = p.category;
    const d = document.createElement("div"); d.className = "muted"; d.textContent = p.description || "";
    const pr = document.createElement("div"); pr.className = "price"; pr.textContent = rupiah(p.price);
    body.append(h, c, d, pr);
    el.append(img, body);
    grid.appendChild(el);
  }
}

/* ---------- AUTH ---------- */
async function refreshAuth() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { isAdmin = false; $("loginBox").classList.remove("hide"); $("adminBox").classList.add("hide"); return; }
  const { data: ok, error } = await db.rpc("claim_admin");
  if (error || !ok) {
    isAdmin = false;
    show("Akun ini bukan admin, sehingga tidak bisa mengubah produk.", "err");
    $("loginBox").classList.add("hide"); $("adminBox").classList.remove("hide");
    $("who").textContent = session.user.email + " (bukan admin)";
    $("rows").replaceChildren();
    return;
  }
  isAdmin = true;
  $("who").textContent = "Admin: " + session.user.email;
  $("loginBox").classList.add("hide"); $("adminBox").classList.remove("hide");
  loadAdmin();
}
$("btnLogin").onclick = async () => {
  const { error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  if (error) return show("Gagal masuk: " + error.message, "err");
  show("Berhasil masuk.", "ok"); refreshAuth();
};
$("btnSignup").onclick = async () => {
  const { data, error } = await db.auth.signUp({ email: $("email").value.trim(), password: $("password").value });
  if (error) return show("Gagal daftar: " + error.message, "err");
  if (data.session) { show("Akun dibuat.", "ok"); refreshAuth(); }
  else show("Akun dibuat. Cek email Anda untuk konfirmasi, lalu masuk.", "ok");
};
$("btnLogout").onclick = async () => { await db.auth.signOut(); isAdmin = false; refreshAuth(); };

/* ---------- ADMIN CRUD ---------- */
async function loadAdmin() {
  const { data, error } = await db.from("products").select("*").order("category").order("name");
  if (error) return show("Gagal memuat produk: " + error.message, "err");
  const tb = $("rows"); tb.replaceChildren();
  for (const p of data) {
    const tr = document.createElement("tr");
    const cells = [p.name, p.category, rupiah(p.price), String(p.stock)];
    for (const t of cells) { const td = document.createElement("td"); td.textContent = t; tr.appendChild(td); }
    const st = document.createElement("td"); const tag = document.createElement("span");
    tag.className = "tag " + (p.active ? "on" : "off"); tag.textContent = p.active ? "Aktif" : "Nonaktif";
    st.appendChild(tag); tr.appendChild(st);
    const ac = document.createElement("td");
    const be = mk("Edit", "btn ghost sm", () => editProduct(p));
    const bt = mk(p.active ? "Nonaktifkan" : "Aktifkan", "btn ghost sm", () => toggle(p));
    const bd = mk("Hapus", "btn bad sm", () => remove(p));
    ac.append(be, " ", bt, " ", bd); tr.appendChild(ac);
    tb.appendChild(tr);
  }
}
function mk(text, cls, fn) { const b = document.createElement("button"); b.className = cls; b.textContent = text; b.onclick = fn; return b; }
function resetForm() {
  $("pid").value = ""; $("pname").value = ""; $("pprice").value = ""; $("pcat").value = "Mie Ayam";
  $("pstock").value = 0; $("pdesc").value = ""; $("pimg").value = ""; $("pactive").checked = true;
  $("formTitle").textContent = "Tambah Produk";
}
$("btnReset").onclick = resetForm;
function editProduct(p) {
  $("pid").value = p.id; $("pname").value = p.name; $("pprice").value = p.price; $("pcat").value = p.category;
  $("pstock").value = p.stock; $("pdesc").value = p.description || ""; $("pimg").value = p.image_url || "";
  $("pactive").checked = p.active; $("formTitle").textContent = "Edit Produk";
  window.scrollTo({ top: 0, behavior: "smooth" });
}
$("btnSave").onclick = async () => {
  if (!isAdmin) return show("Hanya admin yang bisa menyimpan produk.", "err");
  const name = $("pname").value.trim(), price = parseInt($("pprice").value, 10), stock = parseInt($("pstock").value, 10) || 0;
  if (!name) return show("Nama produk wajib diisi.", "err");
  if (!Number.isInteger(price) || price < 0) return show("Harga harus angka 0 atau lebih.", "err");
  const row = { name, price, stock, category: $("pcat").value, description: $("pdesc").value.trim() || null,
                image_url: $("pimg").value.trim() || null, active: $("pactive").checked };
  const id = $("pid").value;
  const { error } = id ? await db.from("products").update(row).eq("id", id) : await db.from("products").insert(row);
  if (error) return show("Gagal menyimpan: " + (error.code === "23505" ? "nama produk sudah ada." : error.message), "err");
  show(id ? "Produk diperbarui." : "Produk ditambahkan.", "ok"); resetForm(); loadAdmin();
};
async function toggle(p) {
  const { error } = await db.from("products").update({ active: !p.active }).eq("id", p.id);
  if (error) return show(error.message, "err"); loadAdmin();
}
async function remove(p) {
  if (!confirm('Hapus "' + p.name + '"?')) return;
  const { error } = await db.from("products").delete().eq("id", p.id);
  if (error) return show(error.message, "err"); show("Produk dihapus.", "ok"); loadAdmin();
}

loadMenu();
</script>
</body>
</html>
