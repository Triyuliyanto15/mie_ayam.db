<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layar Antrean - Mie Ayam Suka Rasa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍜</text></svg>">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;
    background-color:#17100a;
    background-image:radial-gradient(rgba(255,190,120,.06) 1.2px,transparent 1.4px),radial-gradient(900px 520px at 8% -8%,#3a2312,transparent 62%),radial-gradient(800px 480px at 100% 100%,#2c1f10,transparent 60%),linear-gradient(180deg,#1d140d,#120c07);
    background-size:26px 26px,auto,auto,auto}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:linear-gradient(135deg,#c2410c,#e8890c);box-shadow:0 4px 18px rgba(0,0,0,.4)}
  header h1{margin:0;font-size:clamp(1.2rem,3vw,2.2rem)}
  #clock{font-size:clamp(1.1rem,2.6vw,2rem);font-weight:700}
  main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px;min-height:0}
  @media(max-width:700px){main{grid-template-columns:1fr}}
  section{border-radius:18px;padding:16px;display:flex;flex-direction:column;min-height:0}
  section h2{margin:0 0 12px;font-size:clamp(1.3rem,3vw,2.2rem)}
  #prep{background:rgba(58,40,26,.82);box-shadow:0 8px 26px rgba(0,0,0,.35)} #ready{background:rgba(18,61,28,.88);box-shadow:0 8px 26px rgba(0,0,0,.35)}
  .nums{display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;overflow:hidden}
  .num{font-weight:900;border-radius:14px;padding:8px 20px;font-size:clamp(2rem,6vw,4.6rem);line-height:1.1}
  #prep .num{background:#4a3a2a;color:#ffd8a8}
  #ready .num{background:#2f9e44;color:#fff}
  #ready .num.new{animation:pulse .8s ease-in-out 6}
  @keyframes pulse{50%{transform:scale(1.12);background:#51cf66}}
  .empty{opacity:.6;font-size:clamp(1rem,2vw,1.6rem)}
  footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 18px 14px;opacity:.85;font-size:.95rem}
  button{background:#3b2f24;color:#fff;border:1px solid #5a4636;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
  #net{color:#ffa8a8}
</style>
</head>
<body>
<header><h1>🍜 Mie Ayam Suka Rasa</h1><div id="clock"></div></header>
<main>
  <section id="prep"><h2>Sedang Disiapkan</h2><div class="nums" id="prepNums"></div></section>
  <section id="ready"><h2>Siap Diambil</h2><div class="nums" id="readyNums"></div></section>
</main>
<footer>
  <span>Silakan ambil pesanan jika nomor Anda sudah muncul di kolom hijau.</span>
  <span><span id="net"></span> <button id="btnSound" type="button">🔔 Bunyi: Mati</button> <button id="btnFull" type="button">Layar penuh</button></span>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// Halaman ini hanya menerima nomor antrean dan status (tanpa nama atau harga pelanggan).
const db = window.supabase.createClient("https://xwxcegylykvqzwypypvx.supabase.co", "sb_publishable_I-fiTcoCDDGYX1ay9a5TnQ_Te3xFCzN");
const $ = (id) => document.getElementById(id);
let known = null, sound = false, ctx = null;

function beep() {
  if (!sound) return;
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    [880, 1175].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.25);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.25 + 0.22);
      o.start(ctx.currentTime + i * 0.25); o.stop(ctx.currentTime + i * 0.25 + 0.24);
    });
  } catch (e) { /* abaikan */ }
}
function fill(el, list, cls, fresh) {
  el.replaceChildren();
  if (!list.length) { const p = document.createElement("div"); p.className = "empty"; p.textContent = "-"; el.append(p); return; }
  for (const n of list) {
    const d = document.createElement("div");
    d.className = "num" + (cls ? " " + cls : "") + (fresh && fresh.has(n) ? " new" : "");
    d.textContent = n; el.append(d);
  }
}
async function poll() {
  const { data, error } = await db.rpc("queue_board");
  $("net").textContent = error ? "Menyambung ulang…" : "";
  if (error || !data) return;
  const fresh = new Set();
  if (known) for (const n of data.ready) if (!known.has(n)) fresh.add(n);
  known = new Set(data.ready);
  if (fresh.size) beep();
  fill($("prepNums"), data.preparing, "", null);
  fill($("readyNums"), data.ready, "", fresh);
}
function tick() {
  $("clock").textContent = new Date().toLocaleTimeString("id-ID", { timeZone: "Asia/Jakarta", hour: "2-digit", minute: "2-digit" }) + " WIB";
}
$("btnSound").onclick = () => { sound = !sound; $("btnSound").textContent = "🔔 Bunyi: " + (sound ? "Nyala" : "Mati"); if (sound) beep(); };
$("btnFull").onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); };
tick(); setInterval(tick, 15000);
poll(); setInterval(poll, 4000);
</script>
</body>
</html>
